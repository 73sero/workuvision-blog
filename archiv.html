  <script>
    function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function fmtDate(iso){
      try {
        const d = new Date(iso);
        const m = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
        return d.getDate() + '. ' + m[d.getMonth()] + ' ' + d.getFullYear();
      } catch(e) { return iso; }
    }

    let ALL = [];
    let activeCat = 'all';
    let activeQuery = '';

    function render() {
      const grid = document.getElementById('grid');
      let list = ALL.slice();
      if (activeCat !== 'all') list = list.filter(a => a.category === activeCat);
      if (activeQuery) {
        const q = activeQuery.toLowerCase();
        list = list.filter(a =>
          (a.title || '').toLowerCase().includes(q) ||
          (a.excerpt || '').toLowerCase().includes(q) ||
          (a.body || '').toLowerCase().includes(q)
        );
      }
      list.sort((a,b) => (b.date||'').localeCompare(a.date||''));
      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><h2>Keine Treffer</h2><p>Anderer Suchbegriff oder andere Kategorie?</p></div>';
        return;
      }
      grid.innerHTML = list.map(a => `
        <a class="pc" href="/artikel/${encodeURIComponent(a.slug)}.html">
          <div class="pt"><img class="pti" src="${escHtml(a.thumbnail)}" alt="${escHtml(a.thumbnailAlt||'')}" loading="lazy"><div class="pcb ${escHtml(a.badgeColor)}">${escHtml(a.badge)}</div></div>
          <div class="pb"><div class="pd">${fmtDate(a.date)}</div><h3 class="ptt">${escHtml(a.title)}</h3><p class="pe">${escHtml(a.excerpt)}</p></div>
        </a>`).join('');
    }

    document.getElementById('pills').addEventListener('click', e => {
      const btn = e.target.closest('.pill');
      if (!btn) return;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
      btn.classList.add('on');
      activeCat = btn.dataset.cat;
      render();
    });

    document.getElementById('search').addEventListener('input', e => {
      activeQuery = e.target.value.trim();
      render();
    });

    fetch('content.json?v=' + Date.now(), {cache: 'no-cache'})
      .then(r => r.json())
      .then(data => { ALL = data.articles || []; render(); })
      .catch(e => {
        document.getElementById('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h2>Fehler beim Laden</h2></div>';
        console.error(e);
      });
  </script>
