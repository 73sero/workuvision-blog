<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Newsletter-Anmeldung bei Workuvision bestätigt.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://workuvision.de/newsletter-bestaetigt.html">
  <title>Anmeldung bestätigt | Workuvision</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#DC052D">
  <link rel="preload" href="/fonts/Oswald-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Outfit-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Oswald';src:url('/fonts/Oswald-700.woff2') format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:'Outfit';src:url('/fonts/Outfit-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Outfit';src:url('/fonts/Outfit-600.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:'JetBrains Mono';src:url('/fonts/JetBrainsMono-700.woff2') format('woff2');font-weight:700;font-display:swap}
    :root{--red:#DC052D;--dark:#060A10;--white:#F2F2F2;--gray:#9BAEC1;--fh:'Oswald',Impact,sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Outfit','Inter',system-ui,sans-serif}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--fb);background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;line-height:1.7}
    a{color:inherit;text-decoration:none}
    .card{max-width:560px}
    .badge{font-family:var(--fm);font-size:.6rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:1.5rem}
    .check{font-size:3.5rem;margin-bottom:1rem}
    h1{font-family:var(--fh);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.1;margin-bottom:1.2rem}
    p{color:#d6dde6;margin-bottom:2rem}
    .btn{display:inline-block;font-family:var(--fm);font-size:.62rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--white);background:var(--red);padding:.9rem 1.8rem;border-radius:3px;transition:opacity .3s}
    .btn:hover{opacity:.85}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Workuvision Newsletter</div>
    <div class="check">✅</div>
    <h1>Anmeldung bestätigt</h1>
    <p>Danke! Deine E-Mail-Adresse ist jetzt aktiviert. Du bekommst ab sofort unsere Bayern-Updates direkt ins Postfach. Abmelden kannst du dich jederzeit über den Link am Ende jeder Mail.</p>
    <a class="btn" href="/">← Zur Startseite</a>
  </div>
</body>
</html>
