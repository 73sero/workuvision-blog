<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Workuvision — FC Bayern München Insider. Taktik-Analysen, Fan-Reaktionen, Transfer-News.">
  <meta name="author" content="Abdel Worku">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://workuvision.de/artikel.html">
  <title id="page-title">Artikel — Workuvision</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#DC052D">
  <link rel="preload" href="fonts/Oswald-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Outfit-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Oswald';src:url('fonts/Oswald-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Oswald';src:url('fonts/Oswald-600.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:'Oswald';src:url('fonts/Oswald-700.woff2') format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:'Outfit';src:url('fonts/Outfit-300.woff2') format('woff2');font-weight:300;font-display:swap}
    @font-face{font-family:'Outfit';src:url('fonts/Outfit-400.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Outfit';src:url('fonts/Outfit-600.woff2') format('woff2');font-weight:600;font-display:swap}
    @font-face{font-family:'Outfit';src:url('fonts/Outfit-700.woff2') format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-500.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-700.woff2') format('woff2');font-weight:700;font-display:swap}

    :root{--red:#DC052D;--red-glow:rgba(220,5,45,0.35);--dark:#060A10;--navy:#0B1622;--white:#F2F2F2;--gray:#9BAEC1;--gold:#D4A843;--glass:rgba(14,25,42,0.55);--gb:rgba(255,255,255,0.06);--fh:'Oswald',Impact,sans-serif;--fm:'JetBrains Mono','SF Mono',monospace;--fb:'Outfit','Inter',system-ui,sans-serif;--mw:880px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:var(--fb);background:var(--dark);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.7}
    a{color:inherit;text-decoration:none}

    .topbar{position:fixed;top:0;left:0;right:0;background:rgba(6,10,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--gb);z-index:100;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
    .topbar a{font-family:var(--fh);font-size:1.2rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;display:flex;align-items:center;gap:.6rem}
    .topbar img{width:32px;height:32px;border-radius:50%;border:2px solid rgba(220,5,45,.4)}
    .topbar nav{display:flex;gap:1.8rem}
    .topbar nav a{font-family:var(--fm);font-size:.6rem;font-weight:500;letter-spacing:2.5px;color:var(--gray);transition:color .3s}
    .topbar nav a:hover{color:var(--white)}

    main{max-width:var(--mw);margin:0 auto;padding:7rem 2rem 5rem}

    .back{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--fm);font-size:.6rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gray);margin-bottom:2rem;transition:color .3s}
    .back:hover{color:var(--red)}

    .meta{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem;font-family:var(--fm);font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray)}
    .badge{font-weight:700;padding:.3rem .8rem;border-radius:3px}
    .bt{background:var(--red);color:white}
    .brc{background:var(--gold);color:var(--dark)}
    .bx{background:rgba(255,255,255,.12);color:white}
    .bv{background:rgba(6,10,16,.75);color:var(--gold);border:1px solid rgba(212,168,67,.25)}

    h1{font-family:var(--fh);font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:1px;line-height:1.1;text-transform:uppercase;margin-bottom:1.5rem}

    .hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:2rem 0;border:1px solid var(--gb)}

    .body-text{font-size:1.05rem;color:rgba(242,242,242,.85);font-weight:300}
    .body-text p{margin-bottom:1.5rem}
    .body-text strong{color:var(--white);font-weight:600}
    .body-text a{color:var(--red);text-decoration:underline}
    .body-text h2{font-family:var(--fh);font-size:1.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:2.5rem 0 1rem;color:var(--white)}
    .body-text h3{font-family:var(--fh);font-size:1.2rem;font-weight:600;letter-spacing:.5px;margin:2rem 0 .8rem;color:var(--white)}

    .source-box{margin-top:3rem;padding:1.5rem;border-left:3px solid var(--red);background:var(--glass);border-radius:0 6px 6px 0;font-size:.9rem;color:var(--gray)}
    .source-box a{color:var(--red);font-weight:600}

    .related{margin-top:5rem;border-top:1px solid var(--gb);padding-top:3rem}
    .related h2{font-family:var(--fh);font-size:1.4rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
    .related-card{background:var(--glass);border:1px solid var(--gb);border-radius:6px;padding:1.2rem;transition:all .3s;display:block}
    .related-card:hover{border-color:rgba(220,5,45,.3);transform:translateY(-2px)}
    .related-card .d{font-family:var(--fm);font-size:.55rem;letter-spacing:1.5px;color:var(--gray);margin-bottom:.5rem;text-transform:uppercase}
    .related-card .t{font-family:var(--fh);font-size:1rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;line-height:1.3}

    .err{text-align:center;padding:4rem 1rem}
    .err h2{font-family:var(--fh);font-size:2rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:1rem}

    @media(max-width:600px){
      .topbar{padding:.8rem 1rem}
      .topbar nav{gap:1rem}
      main{padding:6rem 1.2rem 3rem}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html"><img src="img/logo.jpg" alt=""><span>Workuvision</span></a>
    <nav>
      <a href="index.html">Start</a>
      <a href="archiv.html">Archiv</a>
      <a href="https://www.tiktok.com/@workuvision" target="_blank" rel="noopener" style="color:var(--red)">TikTok</a>
    </nav>
  </header>

  <main id="article-root">
    <a href="archiv.html" class="back">← Alle Artikel</a>
    <div id="article-content"><p style="color:var(--gray)">Lade Artikel…</p></div>
  </main>

  <script>
    function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function fmtDate(iso){
      try {
        const d = new Date(iso);
        const m = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
        return d.getDate() + '. ' + m[d.getMonth()] + ' ' + d.getFullYear();
      } catch(e) { return iso; }
    }

    async function loadArticle() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      const root = document.getElementById('article-content');
      if (!slug) {
        root.innerHTML = '<div class="err"><h2>Kein Artikel ausgewählt</h2><p style="color:var(--gray)">Wähle einen Artikel aus dem <a href="archiv.html" style="color:var(--red)">Archiv</a>.</p></div>';
        return;
      }
      try {
        const res = await fetch('content.json?v=' + Date.now(), {cache: 'no-cache'});
        const data = await res.json();
        const article = (data.articles || []).find(a => a.slug === slug);
        if (!article) {
          root.innerHTML = '<div class="err"><h2>Artikel nicht gefunden</h2><p style="color:var(--gray)">Vielleicht wurde der Artikel umbenannt. <a href="archiv.html" style="color:var(--red)">Zurück zum Archiv</a>.</p></div>';
          return;
        }
        document.getElementById('page-title').textContent = article.title + ' — Workuvision';
        document.querySelector('meta[name="description"]').setAttribute('content', article.excerpt || article.title);

        const bodyHtml = (article.body || '').split('\n\n').map(p => p.trim() ? `<p>${escHtml(p).replace(/\n/g,'<br>')}</p>` : '').join('');

        const sourceBox = article.sourceUrl ? `
          <div class="source-box">
            <strong style="color:var(--white);display:block;margin-bottom:.4rem">Quelle</strong>
            <a href="${escHtml(article.sourceUrl)}" target="_blank" rel="noopener">${escHtml(article.sourceName || article.sourceUrl)}</a>
          </div>` : '';

        // Related articles (gleiche Kategorie, nicht selbst, max. 3)
        const related = (data.articles || [])
          .filter(a => a.slug !== slug && a.category === article.category)
          .slice(0, 3);
        const relatedHtml = related.length ? `
          <section class="related">
            <h2>Mehr aus ${article.badge || 'dieser Kategorie'}</h2>
            <div class="related-grid">
              ${related.map(r => `
                <a class="related-card" href="artikel.html?slug=${encodeURIComponent(r.slug)}">
                  <div class="d">${fmtDate(r.date)}</div>
                  <div class="t">${escHtml(r.title)}</div>
                </a>`).join('')}
            </div>
          </section>` : '';

        root.innerHTML = `
          <div class="meta">
            <span class="badge ${escHtml(article.badgeColor)}">${escHtml(article.badge)}</span>
            <span>${fmtDate(article.date)}</span>
            <span>·</span>
            <span>${escHtml(article.readtime)}</span>
          </div>
          <h1>${escHtml(article.title)}</h1>
          <img class="hero-img" src="${escHtml(article.thumbnail)}" alt="${escHtml(article.thumbnailAlt || '')}">
          <div class="body-text">${bodyHtml}</div>
          ${sourceBox}
          ${relatedHtml}
        `;
      } catch(e) {
        root.innerHTML = '<div class="err"><h2>Fehler beim Laden</h2><p style="color:var(--gray)">Bitte später nochmal versuchen.</p></div>';
        console.error(e);
      }
    }
    loadArticle();
  </script>
</body>
</html>
